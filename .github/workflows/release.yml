name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: important-task-manager-linux
          - os: macos-latest
            artifact: important-task-manager-macos
          - os: windows-latest
            artifact: important-task-manager-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build]"
      - name: Build standalone binary
        run: pyinstaller packaging/important-task-manager.spec --noconfirm
      - name: Smoke test the binary (Unix)
        if: runner.os != 'Windows'
        run: ./dist/important-task-manager --version
      - name: Smoke test the binary (Windows)
        if: runner.os == 'Windows'
        run: ./dist/important-task-manager.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Zip each platform build
        run: |
          cd dist
          for dir in */; do
            (cd "$dir" && zip -r "../${dir%/}.zip" .)
          done
          ls -lh ./*.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
