[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "important-task-manager"
dynamic = ["version"]
description = "A keyboard-friendly desktop task manager with due dates, recurring tasks and reminders."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Osman Bolanos" },
]
keywords = ["tasks", "todo", "reminders", "desktop", "pyside6", "qt"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "PySide6>=6.5,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
]
build = [
    "pyinstaller>=6.0",
]

[project.gui-scripts]
important-task-manager = "app:main"

[project.urls]
Homepage = "https://github.com/shadow640lc-dow/important-task-manager"
Issues = "https://github.com/shadow640lc-dow/important-task-manager/issues"

[tool.setuptools]
py-modules = [
    "app",
    "config",
    "database",
    "dialogs",
    "notifications",
    "scheduler",
    "tasks",
]

[tool.setuptools.dynamic]
version = { attr = "config.APP_VERSION" }

[tool.pytest.ini_options]
testpaths = ["tests"]
